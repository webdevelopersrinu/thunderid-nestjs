name: Add contributor

# Comment "@all-contributors please add @username for code" on a PR or
# issue and this updates the contributors table in the README.
on:
  issue_comment:
    types: [created]

jobs:
  add-contributor:
    if: contains(github.event.comment.body, '@all-contributors')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: all-contributors/all-contributors-bot@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
